[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbmp-sat-cp-mip"
version = "0.1.0"
description = "SAT, CP and MIP/ILP approaches for the Cyclic Bandwidth Minimization Problem"
requires-python = ">=3.11"
dependencies = [
    "python-sat>=1.8",
    "scipy>=1.11",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
baselines = ["docplex>=2.25", "cplex>=22.1", "gurobipy>=11.0", "ortools>=9.8", "highspy>=1.7"]
plot = ["cnsplots>=0.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
